x-build: &build
    context: .
    args:
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}

services:
    app:
        image: chatapp:latest
        build: *build
        ports:
            - "8000:8000"
        env_file: .env
        environment:
            DB_HOST: mysql
        command: ["serve"]
        depends_on:
            mysql:
                condition: service_healthy
        volumes:
            - storage_data:/var/www/html/storage/app/public

    reverb:
        image: chatapp:latest
        build: *build
        ports:
            - "8080:8080"
        env_file: .env
        environment:
            DB_HOST: mysql
        command: ["reverb"]
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: laravel_react_messinger
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    mysql_data:
    storage_data:
